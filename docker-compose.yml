services:
  db:
    image: postgis/postgis:16-3.4
    container_name: surge-postgis
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-surgedb}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - surge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-surgedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: surge-backend-java
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-surgedb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      PYTHON_ENGINE_URL: http://optimizer:8000
    depends_on:
      db:
        condition: service_healthy

  optimizer:
    build:
      context: ./optimisation-python
      dockerfile: Dockerfile
    container_name: surge-optimizer-python
    restart: always
    ports:
      - "8000:8000"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO

  frontend:
    build:
      context: ./web-map
      dockerfile: Dockerfile
    container_name: surge-web-map
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  surge_postgres_data:
