services:
  db:
    image: postgis/postgis:16-3.4
    container_name: surge-postgis
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-surgedb}
      POSTGRES_USER: ${DB_USER:-postgres}
      # Required rather than defaulted. A stack that silently came up on "postgres" is one nobody
      # ever notices is using it.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      # Loopback only. The database has no business being reachable from the network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - surge_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-surgedb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend-java
      dockerfile: Dockerfile
    container_name: surge-backend-java
    restart: always
    ports:
      # Loopback only, so the sign-in throttle can trust the headers nginx writes: a caller that
      # reached this port directly could set X-Real-IP / X-Forwarded-For to anything. Browsers use
      # :3000, which proxies /api. This stays published for local tools and the Vite dev server.
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-surgedb}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      PYTHON_ENGINE_URL: http://optimizer:8000
      # Passed through without a default: the backend refuses to seed a first administrator
      # without a password, but only on a database that has none yet, so an existing deployment
      # does not need this set.
      SURGE_BOOTSTRAP_ADMIN_USERNAME: ${SURGE_BOOTSTRAP_ADMIN_USERNAME:-admin}
      SURGE_BOOTSTRAP_ADMIN_EMAIL: ${SURGE_BOOTSTRAP_ADMIN_EMAIL:-admin@surge.energy}
      SURGE_BOOTSTRAP_ADMIN_PASSWORD: ${SURGE_BOOTSTRAP_ADMIN_PASSWORD:-}
      # Must be set per deployment. The code default is a constant in a public repository, so
      # leaving it unset lets anyone forge an administrator token.
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set in .env}
    depends_on:
      db:
        condition: service_healthy
      optimizer:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  optimizer:
    build:
      context: ./optimisation-python
      dockerfile: Dockerfile
    container_name: surge-optimizer-python
    restart: always
    ports:
      # Loopback only. The optimiser has no authentication of its own and is meant to be reached
      # by the backend alone; the published port exists for local debugging.
      - "127.0.0.1:8000:8000"
    environment:
      ENVIRONMENT: production
      LOG_LEVEL: INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  frontend:
    build:
      context: ./web-map-next
      dockerfile: Dockerfile
    container_name: surge-web-map
    restart: always
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  surge_postgres_data:
