spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    # Fixed test key. There is deliberately no default in the application, so every context that
    # builds a JwtTokenProvider has to supply one; a real deployment gets a random value from
    # APP_JWT_SECRET. Never use this outside tests.
    secret: test-only-signing-key-at-least-32-bytes-long
