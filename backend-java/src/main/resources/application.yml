server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: surge-backend

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

surge:
  python-engine:
    url: ${PYTHON_ENGINE_URL:http://localhost:8000}

  # Contract C7: the profile definition-hash handshake.
  #
  # Python owns the profile definitions and Java holds only a hash of them. When profiles are on,
  # startup compares this value with what the engine publishes, and refuses to start on a mismatch
  # or an unreachable engine. A disagreement here would otherwise produce results ranked under a
  # policy this service does not know about — plausible-looking numbers attributed to the wrong
  # policy, which nothing downstream could detect.
  #
  # The expected hash has no default: it is set at the FRZ-1 policy freeze, and a deployment that
  # enables profiles without it has nothing to verify against. Turning profiles on before FRZ-1 is
  # therefore not a supported configuration, and fails loudly rather than silently.
  profiles:
    enabled: ${SURGE_PROFILES_ENABLED:false}
    expected-definition-hash: ${SURGE_PROFILE_DEFINITION_HASH:}
    handshake-timeout-ms: ${SURGE_PROFILE_HANDSHAKE_TIMEOUT_MS:5000}

  # The single administrator created on a fresh database. Every other account is provisioned by an
  # administrator; nothing here ever overwrites an existing password, so credentials changed later
  # survive a restart.
  #
  # The password has no default on purpose. It used to fall back to "admin" with a warning in the
  # logs, and an instance seeded that way reached the internet with administrator access while the
  # warning went unread. Seeding now fails instead — but only when an account is actually being
  # created, so an existing database still starts without this set.
  bootstrap-admin:
    username: ${SURGE_BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${SURGE_BOOTSTRAP_ADMIN_EMAIL:admin@surge.energy}
    password: ${SURGE_BOOTSTRAP_ADMIN_PASSWORD:}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:surgedb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.power.surge: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE