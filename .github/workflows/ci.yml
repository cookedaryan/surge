name: Verify SURGE

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Demo-optimisation level branches (demo-opt/l1-*, l2-*, l3-*) may edit only the
  # paths their contract C10 ownership map grants. Other branches skip this job.
  ownership:
    name: Level ownership
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'demo-opt/l')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check changed paths against the level ownership map
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          suffix="${HEAD_REF#demo-opt/l}"
          level="L${suffix%%-*}"
          python3 scripts/ci/check_ownership.py --level "$level" --base "origin/$BASE_REF"

  backend:
    name: Java backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: chmod +x mvnw
      - run: ./mvnw verify --batch-mode

  optimiser:
    name: Python optimiser
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: optimisation-python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: optimisation-python/requirements.lock.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.lock.txt
      - run: python -m ruff check app tests
      - run: python -m mypy app
      - run: python -m pytest -q

  frontend:
    name: Web map
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-map-next
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web-map-next/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  docker:
    name: Container builds
    runs-on: ubuntu-latest
    env:
      # compose refuses to interpolate without this, by design — a deployment that forgets the
      # signing key should fail loudly rather than start and fall back to something guessable.
      # A build never runs the application, so a throwaway value is the right thing here; the
      # guard still holds for anyone actually starting the stack.
      APP_JWT_SECRET: ci-build-only-value-never-used-to-sign-anything
      DB_PASSWORD: ci-build-only-value-no-database-is-started
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build
