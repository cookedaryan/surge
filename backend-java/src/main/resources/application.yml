server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: surge-backend

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

surge:
  python-engine:
    url: ${PYTHON_ENGINE_URL:http://localhost:8000}

  # The single administrator created on a fresh database. Every other account is provisioned by an
  # administrator; nothing here ever overwrites an existing password, so credentials changed later
  # survive a restart. Override the password before exposing the instance to anyone else.
  bootstrap-admin:
    username: ${SURGE_BOOTSTRAP_ADMIN_USERNAME:admin}
    email: ${SURGE_BOOTSTRAP_ADMIN_EMAIL:admin@surge.energy}
    password: ${SURGE_BOOTSTRAP_ADMIN_PASSWORD:admin}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:surgedb}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
        format_sql: true
        jdbc:
          batch_size: 25
        order_inserts: true
        order_updates: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.power.surge: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE